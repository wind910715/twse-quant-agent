name: TWSE Quant Agent (21:00 Screener + Intraday Monitor + Sat 09:00 Backtest)

on:
  schedule:
    # 1. 週一至週五 晚間 21:00 (UTC 13:00)：執行五大指數成分股選股與極簡戰報
    - cron: '0 13 * * 1-5'
    # 2. 週一至週五 盤中 09:00~13:35 (UTC 01:00~05:35)：每 5 分鐘(內部每30秒)隨侍偵測進出場
    - cron: '*/5 1-5 * * 1-5'
    # 3. 每週六 早上 09:00 (UTC 01:00)：自動執行歷史回測確認勝率與 MDD
    - cron: '0 1 * * 6'
  workflow_dispatch:
    inputs:
      task_mode:
        description: '手動測試模式 (screener / monitor / backtest)'
        required: false
        default: 'backtest'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quant-task:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. 檢出倉庫程式碼與快取狀態
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 3.11 與量化套件
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r requirements.txt

      - name: 3. 依排程時段自動分流執行任務
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DOW=$(date -u +%u)
          HOUR_UTC=$(date -u +%H)
          MODE="${{ github.event.inputs.task_mode }}"

          if [ "$MODE" = "backtest" ] || [ "$DOW" -eq 6 ]; then
            echo "📈 執行每週六 09:00 自動回測績效健檢 (backtest.py)..."
            python backtest.py
            echo "🧪 執行候選策略原型實驗室 (prototype_lab.py)..."
            python prototype_lab.py || true
            echo "🧪 執行 BRK20 組合級驗證 (breakout_lab.py)..."
            python breakout_lab.py || true
            echo "🔎 執行進場選擇濾網實驗 (selection_lab.py)..."
            python selection_lab.py || true
          elif [ "$MODE" = "screener" ] || [ "$HOUR_UTC" -ge 12 ]; then
            echo "📌 執行晚間 21:00 選股與極簡通知 (screener.py)..."
            python screener.py
          else
            echo "🛡️ 執行盤中進場點與停利停損隨侍監控 (monitor.py)..."
            python monitor.py
          fi

      - name: 3b. 月因子輪動名單 (每月 11 日後第一個平日晚間產生)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          D=$(TZ=Asia/Taipei date +%d); W=$(TZ=Asia/Taipei date +%u)
          if [ "$D" = "11" ] || { [ "$W" = "1" ] && [ "$D" -ge 12 ] && [ "$D" -le 13 ]; }; then
            echo "📋 產生雙因子月輪動名單 (factor_rotation.py)..."
            python factor_rotation.py || true
          else
            echo "非名單產生日 (day=$D), 跳過"
          fi

      - name: 4. 同步寫回最新選股、持倉、季度成分股與週六回測數據
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "Quant Task Agent"
          touch latest_report.json active_positions.json latest_backtest.json universe_cache.json prototype_results.json breakout_lab_results.json factor_rotation.json selection_lab_results.json
          git add latest_report.json active_positions.json latest_backtest.json universe_cache.json prototype_results.json breakout_lab_results.json factor_rotation.json selection_lab_results.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Sync quant state $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main || true
            git push origin HEAD || true
          fi
