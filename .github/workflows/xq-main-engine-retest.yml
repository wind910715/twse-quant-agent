name: XQ Main Engine Retest (C21/C02/S02)

# 實驗分支專用: XQ 夜班通過者套主系統引擎重測。不動 main、不動 monitor/screener、
# 不寫 latest_backtest.json、不發 TG、不下單。僅產出 xq_retest_results.json / xq_retest_report.md。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  retest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run XQ main-engine retest
        run: python xq_main_engine_retest.py

      - name: Commit results back to this branch
        # NOTE 2026-10-30 fix: never rebase onto origin HEAD (default branch).
        # The previous `git pull --rebase origin HEAD` rebased this experimental
        # branch onto main, conflicted on sync files, and the swallowed push
        # failure (|| true) left run 40892700237 green with results lost.
        # Push HEAD explicitly to this branch; fail loudly if not fast-forward.
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "Quant Task Agent"
          git add xq_retest_results.json xq_retest_report.md
          if ! git diff --staged --quiet; then
            git commit -m "XQ main-engine retest results $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:exp/xq-main-engine-retest
          fi

      - name: Upload results as artifact (backup if push fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xq-retest-results
          path: |
            xq_retest_results.json
            xq_retest_report.md
          if-no-files-found: error
