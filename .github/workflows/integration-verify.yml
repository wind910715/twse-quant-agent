name: XQ Integration Verify (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q yfinance pandas numpy requests
      - name: Run integrated backtest (no TG, no labs, no commit-back)
        run: python backtest.py
      - name: Upload backtest result
        uses: actions/upload-artifact@v4
        with:
          name: integration-backtest
          path: latest_backtest.json
          if-no-files-found: error
