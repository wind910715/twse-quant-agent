name: XQ P2 Real Weights (manual only)

# P2 實際張數權重回測 (2026-10-30 使用者拍板): 同一 run、同一宇宙、同一資料、同一訊號,
# 僅權重不同 (flat 20% 平權 vs calc_position_size 實際資金佔比 + 100% 資金上限)。
# 實驗分支專用: 不動 main、不動 monitor/screener、不寫 latest_backtest.json、
# 不發 TG、不下單。僅產出 p2_results.json / p2_report.md。

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  p2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r requirements.txt

      - name: Run XQ P2 real-weights backtest
        run: python p2_backtest.py

      - name: Commit results back to this branch
        # Push HEAD explicitly to this branch; fail loudly if not fast-forward.
        # (Never rebase onto origin HEAD: that rebased an exp branch onto main,
        # conflicted, and left run 40892700237 green with results lost.)
        run: |
          git config --local user.email "quant-bot@github.com"
          git config --local user.name "Quant Task Agent"
          git add p2_results.json p2_report.md
          if ! git diff --staged --quiet; then
            git commit -m "XQ P2 real-weights results $(date +'%Y-%m-%d %H:%M')"
            git push origin HEAD:exp/p2-real-weights
          fi

      - name: Upload results as artifact (backup if push fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xq-p2-results
          path: |
            p2_results.json
            p2_report.md
          if-no-files-found: error
